<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reagent Diagram Mockup – UX Preview</title>
<style>
  :root {
    --vscode-font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    --vscode-editor-background: #1e1e1e;
    --vscode-foreground: #d4d4d4;
    --vscode-sideBar-background: #252526;
    --vscode-panel-border: #333;
    --vscode-dropdown-background: #3c3c3c;
    --vscode-dropdown-foreground: #ccc;
    --vscode-dropdown-border: #555;
    --vscode-button-background: #0e639c;
    --vscode-button-foreground: #fff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-debugIcon-startForeground: #89d185;
    --vscode-debugIcon-pauseForeground: #f5c842;
    --vscode-debugIcon-stopForeground: #f48771;
    --vscode-editor-inactiveSelectionBackground: #3a3d41;
    --vscode-charts-blue: #4fc1ff;
    --vscode-charts-purple: #b180d7;
    --vscode-charts-orange: #d18616;
    --vscode-charts-green: #89d185;
    --vscode-charts-yellow: #cca700;
    --vscode-charts-red: #f14c4c;
    --vscode-descriptionForeground: #888;
    --vscode-editorHoverWidget-background: #252526;
    --vscode-editorHoverWidget-border: #454545;
    --vscode-editorHoverWidget-foreground: #ccc;
    --vscode-editor-font-family: 'SF Mono', 'Menlo', monospace;
    --vscode-disabledForeground: #555;
    --vscode-badge-background: #4d4d4d;
    --vscode-badge-foreground: #d4d4d4;
    --panel-width: 280px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--vscode-font-family);
    background: var(--vscode-editor-background);
    color: var(--vscode-foreground);
    overflow: hidden;
    height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ── Toolbar ─────────────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 12px;
    border-bottom: 1px solid var(--vscode-panel-border);
    background: var(--vscode-sideBar-background);
    gap: 8px; flex-shrink: 0;
  }
  .toolbar-left, .toolbar-center, .toolbar-right {
    display: flex; align-items: center; gap: 6px;
  }
  .toolbar-select {
    background: var(--vscode-dropdown-background);
    color: var(--vscode-dropdown-foreground);
    border: 1px solid var(--vscode-dropdown-border);
    border-radius: 3px; padding: 3px 6px; font-size: 12px; cursor: pointer;
  }
  .tab {
    background: transparent; border: none; color: var(--vscode-foreground);
    padding: 4px 12px; cursor: pointer; font-size: 12px; border-radius: 3px;
  }
  .tab:hover { background: var(--vscode-list-hoverBackground); }
  .tab.active {
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
  }
  .debug-toggle {
    background: transparent; border: 1px solid var(--vscode-panel-border);
    color: var(--vscode-foreground);
    padding: 3px 10px; cursor: pointer; font-size: 12px; border-radius: 3px;
    display: flex; align-items: center; gap: 4px;
  }
  .debug-toggle:hover { background: var(--vscode-list-hoverBackground); }
  .debug-toggle.active {
    border-color: var(--vscode-debugIcon-startForeground);
    color: var(--vscode-debugIcon-startForeground);
  }
  .debug-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--vscode-foreground); display: inline-block;
  }
  .debug-toggle.active .debug-dot {
    background: var(--vscode-debugIcon-startForeground);
    animation: pulse 1.5s ease-in-out infinite;
  }

  /* ── Main layout: diagram + side panel ───────────────────── */
  .main {
    display: flex; flex: 1; overflow: hidden;
  }
  .diagram-area {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    min-width: 0;
  }

  /* ── Debug control bar (below toolbar, above diagram) ──── */
  .debug-controls {
    display: none; align-items: center; gap: 6px;
    padding: 4px 12px;
    background: #1a2e1a;
    border-bottom: 1px solid var(--vscode-charts-green);
    flex-shrink: 0;
  }
  .debug-controls.visible { display: flex; }
  .ctrl-btn {
    background: transparent; border: 1px solid var(--vscode-panel-border);
    color: var(--vscode-foreground); border-radius: 3px;
    width: 28px; height: 24px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn:hover { background: var(--vscode-list-hoverBackground); }
  .ctrl-btn.continue-btn { color: var(--vscode-debugIcon-startForeground); }
  .ctrl-btn.step-btn { color: var(--vscode-charts-blue); }
  .ctrl-btn.pause-btn { color: var(--vscode-debugIcon-pauseForeground); }
  .ctrl-btn.stop-btn { color: var(--vscode-debugIcon-stopForeground); }
  .ctrl-btn.restart-btn { color: var(--vscode-charts-green); }
  .ctrl-sep { width: 1px; height: 18px; background: var(--vscode-panel-border); }
  .ctrl-status {
    font-size: 11px; color: var(--vscode-descriptionForeground);
    margin-left: 8px; flex: 1;
  }
  .ctrl-status .state-name {
    color: var(--vscode-debugIcon-startForeground); font-weight: 600;
  }
  .ctrl-status .step-count {
    background: var(--vscode-badge-background); color: var(--vscode-badge-foreground);
    padding: 1px 6px; border-radius: 8px; font-size: 10px; margin-left: 6px;
  }
  .ctrl-agent-sel {
    background: var(--vscode-dropdown-background);
    color: var(--vscode-dropdown-foreground);
    border: 1px solid var(--vscode-dropdown-border);
    border-radius: 3px; padding: 2px 4px; font-size: 11px;
  }

  /* ── Diagram SVG ─────────────────────────────────────────── */
  .diagram-container {
    flex: 1; padding: 12px; overflow: auto;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .diagram-container svg {
    width: 100%; max-width: 650px;
  }

  /* ── Side panel ──────────────────────────────────────────── */
  .side-panel {
    width: var(--panel-width); flex-shrink: 0;
    border-left: 1px solid var(--vscode-panel-border);
    background: var(--vscode-sideBar-background);
    overflow-y: auto; overflow-x: hidden;
    font-size: 11px;
  }
  .panel-section {
    border-bottom: 1px solid var(--vscode-panel-border);
  }
  .panel-header {
    padding: 6px 10px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--vscode-descriptionForeground);
    background: var(--vscode-editor-background);
    cursor: pointer; display: flex; align-items: center; gap: 4px;
    user-select: none;
  }
  .panel-header:hover { background: var(--vscode-list-hoverBackground); }
  .panel-header .chevron { font-size: 9px; transition: transform 0.15s; }
  .panel-header.collapsed .chevron { transform: rotate(-90deg); }
  .panel-body { padding: 4px 10px 8px; }
  .panel-header.collapsed + .panel-body { display: none; }

  /* ── Protocol info ───────────────────────────────────────── */
  .proto-meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
  .proto-meta dt { color: var(--vscode-descriptionForeground); }
  .proto-meta dd { color: var(--vscode-foreground); }

  /* ── Agent cards ─────────────────────────────────────────── */
  .agent-card {
    background: var(--vscode-editor-background);
    border: 1px solid var(--vscode-panel-border);
    border-radius: 4px; padding: 6px 8px; margin: 4px 0;
  }
  .agent-card-header {
    display: flex; align-items: center; gap: 4px; margin-bottom: 4px;
  }
  .agent-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .agent-dot.idle { background: var(--vscode-descriptionForeground); }
  .agent-dot.running { background: var(--vscode-debugIcon-startForeground); animation: pulse 1.5s infinite; }
  .agent-dot.paused { background: var(--vscode-debugIcon-pauseForeground); }
  .agent-dot.done { background: var(--vscode-charts-green); }
  .agent-name { font-weight: 600; font-size: 11px; }
  .agent-role { color: var(--vscode-descriptionForeground); font-size: 10px; margin-left: auto; }

  .ctx-table { width: 100%; border-collapse: collapse; }
  .ctx-table td {
    padding: 1px 0; font-family: var(--vscode-editor-font-family);
    font-size: 10px; vertical-align: top;
  }
  .ctx-table .ctx-key { color: var(--vscode-charts-purple); width: 40%; white-space: nowrap; }
  .ctx-table .ctx-val { color: var(--vscode-foreground); word-break: break-all; }
  .ctx-scope-label {
    font-size: 9px; color: var(--vscode-descriptionForeground);
    text-transform: uppercase; letter-spacing: 0.3px; margin: 3px 0 1px;
  }

  /* ── Message log ─────────────────────────────────────────── */
  .msg-log-entry {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 0; font-size: 10px;
  }
  .msg-log-entry .msg-dir {
    font-size: 12px; flex-shrink: 0;
  }
  .msg-log-entry .msg-name {
    color: var(--vscode-charts-blue); font-weight: 500;
  }
  .msg-log-entry .msg-route {
    color: var(--vscode-descriptionForeground);
  }
  .msg-log-entry .msg-ts {
    color: var(--vscode-descriptionForeground); margin-left: auto; font-size: 9px;
  }
  .msg-log-entry.held {
    background: rgba(241, 76, 76, 0.08);
    border-left: 2px solid var(--vscode-charts-red);
    padding-left: 4px;
  }

  /* ── $flow panel ─────────────────────────────────────────── */
  .flow-entry {
    display: flex; gap: 6px; padding: 1px 0;
    font-family: var(--vscode-editor-font-family); font-size: 10px;
  }
  .flow-key { color: var(--vscode-charts-green); }
  .flow-val { color: var(--vscode-foreground); word-break: break-all; }

  /* ── Stats badges ────────────────────────────────────────── */
  .stats-row {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0;
  }
  .stat-badge {
    background: var(--vscode-badge-background);
    color: var(--vscode-badge-foreground);
    padding: 2px 8px; border-radius: 10px; font-size: 10px;
    display: flex; align-items: center; gap: 3px;
  }
  .stat-badge .stat-num { font-weight: 700; }
  .stat-badge.msg-stat { border-left: 2px solid var(--vscode-charts-blue); }
  .stat-badge.state-stat { border-left: 2px solid var(--vscode-charts-purple); }
  .stat-badge.agent-stat { border-left: 2px solid var(--vscode-charts-orange); }
  .stat-badge.time-stat { border-left: 2px solid var(--vscode-charts-yellow); }

  /* ── Sequence diagram ────────────────────────────────────── */
  .participant-box { fill: var(--vscode-sideBar-background); stroke: var(--vscode-panel-border); stroke-width: 1.5; }
  .participant-label { text-anchor: middle; font-size: 13px; font-weight: 600; fill: var(--vscode-foreground); }
  .lang-tag { font-size: 10px; fill: var(--vscode-descriptionForeground); font-weight: 400; }
  .lifeline { stroke: var(--vscode-panel-border); stroke-width: 1; stroke-dasharray: 4 3; }
  .msg-arrow { stroke: var(--vscode-charts-blue); stroke-width: 1.5; }
  .msg-label { text-anchor: middle; font-size: 11px; font-weight: 500; fill: var(--vscode-charts-blue); }
  .action-box { fill: var(--vscode-editor-inactiveSelectionBackground); stroke: var(--vscode-charts-purple); stroke-width: 1; }
  .action-label { text-anchor: middle; font-size: 10px; fill: #cda0e7; }
  .timer-box { fill: var(--vscode-editor-inactiveSelectionBackground); stroke: var(--vscode-charts-yellow); stroke-width: 1; }
  .timer-label { text-anchor: middle; font-size: 10px; fill: var(--vscode-charts-yellow); }
  .control-box { fill: none; stroke-width: 1; stroke-dasharray: 5 3; }
  .loop-box { stroke: var(--vscode-charts-green); }
  .alt-box { stroke: var(--vscode-charts-orange); }
  .control-label { font-size: 10px; font-weight: 600; fill: var(--vscode-descriptionForeground); }
  .alt-divider { stroke: var(--vscode-panel-border); stroke-width: 0.5; stroke-dasharray: 3 2; }
  .arrowhead-fill { fill: var(--vscode-charts-blue); }

  /* ── State machine ───────────────────────────────────────── */
  .sm-edge { stroke: var(--vscode-panel-border); stroke-width: 1.5; }
  .sm-edge-label { font-size: 9px; fill: var(--vscode-descriptionForeground); }
  .sm-circle { stroke-width: 2; }
  .sm-initial { fill: var(--vscode-foreground); stroke: var(--vscode-foreground); }
  .sm-terminal { fill: none; stroke: var(--vscode-foreground); stroke-width: 3; }
  .sm-rect { stroke-width: 1.5; }
  .sm-send { fill: #1a3a5c; stroke: var(--vscode-charts-blue); }
  .sm-receive { fill: #3d2800; stroke: var(--vscode-charts-orange); }
  .sm-action { fill: #2d1a4e; stroke: var(--vscode-charts-purple); }
  .sm-timer { fill: #3d3000; stroke: var(--vscode-charts-yellow); }
  .sm-diamond { fill: #1a3d1a; stroke: var(--vscode-charts-green); stroke-width: 1.5; }
  .sm-label-center { text-anchor: middle; font-size: 11px; fill: var(--vscode-foreground); }
  .sm-node { cursor: pointer; }
  .sm-node:hover .sm-rect, .sm-node:hover .sm-diamond, .sm-node:hover .sm-circle { filter: brightness(1.3); }
  .step { cursor: pointer; }
  .step:hover .msg-arrow { stroke-width: 2.5; }
  .step:hover .action-box { filter: brightness(1.3); }

  /* ── Debug mode ──────────────────────────────────────────── */
  .step.visited .msg-arrow, .step.visited .msg-label { opacity: 0.4; }
  .step.visited .action-box, .step.visited .action-label { opacity: 0.4; }
  .step.active .msg-arrow { stroke: var(--vscode-debugIcon-startForeground); stroke-width: 2.5; animation: pulse-line 1.5s ease-in-out infinite; }
  .step.active .msg-label { fill: var(--vscode-debugIcon-startForeground); }
  .step.active .action-box { stroke: var(--vscode-debugIcon-startForeground); stroke-width: 2; animation: pulse-box 1.5s ease-in-out infinite; }
  .step.future .msg-arrow, .step.future .msg-label, .step.future .action-box, .step.future .action-label { opacity: 0.25; }
  .sm-node.visited .sm-rect, .sm-node.visited .sm-diamond, .sm-node.visited .sm-circle, .sm-node.visited .sm-label-center { opacity: 0.4; }
  .sm-node.active .sm-rect, .sm-node.active .sm-diamond { stroke: var(--vscode-debugIcon-startForeground); stroke-width: 3; animation: pulse-box 1.5s ease-in-out infinite; }
  .sm-node.active .sm-circle { stroke: var(--vscode-debugIcon-startForeground); animation: pulse-box 1.5s ease-in-out infinite; }
  .sm-node.future .sm-rect, .sm-node.future .sm-diamond, .sm-node.future .sm-circle, .sm-node.future .sm-label-center { opacity: 0.25; }

  .tooltip {
    display: none; position: absolute;
    background: var(--vscode-editorHoverWidget-background);
    border: 1px solid var(--vscode-editorHoverWidget-border);
    color: var(--vscode-editorHoverWidget-foreground);
    padding: 6px 10px; border-radius: 4px;
    font-size: 11px; font-family: var(--vscode-editor-font-family);
    white-space: pre; z-index: 100; pointer-events: none;
    max-width: 350px; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes pulse-line { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:0.5} }
  @keyframes pulse-box { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:0.4} }

  /* ── Topology view ───────────────────────────────────────── */
  .topo-rc {
    fill: var(--vscode-editor-background); stroke: var(--vscode-panel-border); stroke-width: 2; rx: 8;
  }
  .topo-rc.selected { stroke: var(--vscode-charts-blue); stroke-width: 2.5; }
  .topo-rc:hover { stroke: var(--vscode-charts-blue); cursor: pointer; }
  .topo-rc-label {
    font-size: 11px; font-weight: 700; fill: var(--vscode-foreground);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .topo-rc-sub { font-size: 9px; fill: var(--vscode-descriptionForeground); }
  .topo-agent-box { stroke-width: 1.5; rx: 4; cursor: pointer; }
  .topo-agent-box:hover { filter: brightness(1.3); }
  .topo-agent-box.lang-ts { fill: #1a3a5c; stroke: var(--vscode-charts-blue); }
  .topo-agent-box.lang-py { fill: #2d1a4e; stroke: var(--vscode-charts-purple); }
  .topo-agent-box.lang-any { fill: #3a3d41; stroke: var(--vscode-descriptionForeground); }
  .topo-agent-box.selected { stroke-width: 2.5; filter: brightness(1.2); }
  .topo-agent-label { font-size: 10px; fill: var(--vscode-foreground); font-weight: 500; }
  .topo-agent-role { font-size: 8px; fill: var(--vscode-descriptionForeground); }
  .topo-link { stroke: var(--vscode-charts-yellow); stroke-width: 2; stroke-dasharray: 6 3; }
  .topo-link:hover { stroke-width: 3; cursor: pointer; }
  .topo-link.active { stroke: var(--vscode-charts-green); stroke-dasharray: none; animation: pulse-line 1s infinite; }
  .topo-link-label { font-size: 9px; fill: var(--vscode-charts-yellow); }
  .topo-msg-particle { fill: var(--vscode-charts-green); }
  .topo-status-dot { r: 4; }
  .topo-status-dot.online { fill: var(--vscode-charts-green); }
  .topo-status-dot.offline { fill: var(--vscode-descriptionForeground); }
  .topo-status-dot.error { fill: var(--vscode-charts-red); }
  .topo-status-dot.discovered { fill: var(--vscode-charts-yellow); }
  .topo-rc.type-browser { stroke: var(--vscode-charts-orange); }
  .topo-rc.type-robot { stroke: var(--vscode-charts-yellow); }
  .topo-rc.type-sim { stroke: var(--vscode-charts-purple); }
  .topo-rc.type-docker { stroke: var(--vscode-charts-blue); }
  .topo-node-badge {
    font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    fill: var(--vscode-editor-background);
  }
  .topo-node-badge-bg { rx: 3; height: 14; }
  .topo-node-badge-bg.runtime-ts { fill: var(--vscode-charts-blue); }
  .topo-node-badge-bg.runtime-py { fill: var(--vscode-charts-purple); }
  .topo-node-badge-bg.runtime-ts-browser { fill: var(--vscode-charts-orange); }
  .topo-agent-count { font-size: 9px; fill: var(--vscode-descriptionForeground); }
  .topo-constraint { font-size: 8px; fill: var(--vscode-charts-yellow); font-style: italic; }

  /* ── Deployment side panel ───────────────────────────────── */
  .deploy-card {
    background: var(--vscode-editor-background); border: 1px solid var(--vscode-panel-border);
    border-radius: 4px; padding: 6px 8px; margin: 4px 0;
  }
  .deploy-card-header {
    display: flex; align-items: center; gap: 4px; margin-bottom: 4px;
  }
  .deploy-card .lang-badge {
    font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 600;
  }
  .lang-badge.ts { background: #1a3a5c; color: var(--vscode-charts-blue); border: 1px solid var(--vscode-charts-blue); }
  .lang-badge.py { background: #2d1a4e; color: var(--vscode-charts-purple); border: 1px solid var(--vscode-charts-purple); }
  .lang-badge.any { background: #3a3d41; color: var(--vscode-descriptionForeground); border: 1px solid var(--vscode-descriptionForeground); }
  .deploy-plays { font-size: 9px; color: var(--vscode-descriptionForeground); padding: 2px 0; }
  .deploy-plays span { color: var(--vscode-charts-blue); }
  .deploy-action-row {
    display: flex; gap: 4px; margin-top: 4px;
  }
  .deploy-action-btn {
    background: var(--vscode-dropdown-background); border: 1px solid var(--vscode-dropdown-border);
    color: var(--vscode-foreground); font-size: 10px; padding: 2px 8px; border-radius: 3px;
    cursor: pointer;
  }
  .deploy-action-btn:hover { background: var(--vscode-list-hoverBackground); }
  .deploy-action-btn.primary { border-color: var(--vscode-charts-green); color: var(--vscode-charts-green); }
  .deploy-action-btn.danger { border-color: var(--vscode-charts-red); color: var(--vscode-charts-red); }
  .link-config {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 6px;
    font-size: 10px; padding: 4px 0;
  }
  .link-config dt { color: var(--vscode-descriptionForeground); }
  .link-config dd { color: var(--vscode-foreground); font-family: var(--vscode-editor-font-family); }
  .node-sel {
    background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground);
    border: 1px solid var(--vscode-dropdown-border); border-radius: 3px; padding: 1px 4px;
    font-size: 10px; width: 100%;
  }
  .provision-info {
    font-size: 9px; color: var(--vscode-descriptionForeground); padding: 4px 0; line-height: 1.4;
  }
  .provision-info code {
    font-family: var(--vscode-editor-font-family); background: var(--vscode-editor-inactiveSelectionBackground);
    padding: 0 3px; border-radius: 2px; font-size: 9px; color: var(--vscode-foreground);
  }
  .node-type-tag {
    font-size: 8px; padding: 1px 5px; border-radius: 3px; font-weight: 600; display: inline-block; margin-left: 4px;
  }
  .node-type-tag.local { background: #2d3a1a; color: var(--vscode-charts-green); border: 1px solid var(--vscode-charts-green); }
  .node-type-tag.ssh { background: #1a3a5c; color: var(--vscode-charts-blue); border: 1px solid var(--vscode-charts-blue); }
  .node-type-tag.docker { background: #1a3a5c; color: var(--vscode-charts-blue); border: 1px solid var(--vscode-charts-blue); }
  .node-type-tag.browser { background: #3d2800; color: var(--vscode-charts-orange); border: 1px solid var(--vscode-charts-orange); }

let viewMode = 'sequence';
let debugMode = false;
let selectedExample = '01';
let selectedRole = 'comma';
let debugStep = 4;
let selectedNode = null;
let selectedAgent = null;
let selectedScenario = 'server-cluster';

const btnSeq = document.getElementById('btn-seq');
const btnSm = document.getElementById('btn-sm');
const btnTopo = document.getElementById('btn-topo');
const btnDebug = document.getElementById('btn-debug');
const exampleSel = document.getElementById('example-select');
const topoScenarioSel = document.getElementById('topo-scenario-select');
const roleSel = document.getElementById('role-select');
const btnStep = document.getElementById('btn-step');

btnSeq.addEventListener('click', () => { viewMode = 'sequence'; render(); });
btnSm.addEventListener('click', () => { viewMode = 'statemachine'; render(); });
btnTopo.addEventListener('click', () => { viewMode = 'topology'; selectedNode = null; selectedAgent = null; render(); });
btnDebug.addEventListener('click', () => { debugMode = !debugMode; if (!debugMode) debugStep = 0; render(); });
exampleSel.addEventListener('change', (e) => {
  selectedExample = e.target.value;
  selectedRole = 'comma'; debugStep = 0;
  render();
});
topoScenarioSel.addEventListener('change', (e) => {
  selectedScenario = e.target.value;
  selectedNode = null; selectedAgent = null;
  render();
});
roleSel.addEventListener('change', (e) => { selectedRole = e.target.value; render(); });
btnStep.addEventListener('click', () => {
  if (!debugMode) return;
  const max = selectedExample === '01' ? 4 : 7;
  debugStep = Math.min(debugStep + 1, max);
  render();
});

document.querySelectorAll('.panel-header').forEach(h => {
  h.addEventListener('click', () => h.classList.toggle('collapsed'));
});

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function arrowMarker() {
  return `<defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" class="arrowhead-fill"/></marker>
    <marker id="sm-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" class="arrowhead-fill"/></marker>
  </defs>`;
}

function stepClass(idx, visitedUpTo, activeIdx) {
  if (!debugMode) return '';
  if (idx === activeIdx) return 'active';
  if (idx <= visitedUpTo) return 'visited';
  return 'future';
}

// ── Render side panel ────────────────────────────────────────

function renderSidePanel() {
  const d = mockData[selectedExample];
  const step = debugMode ? debugStep : d.steps.length - 1;

  document.getElementById('hdr-proto').innerHTML = '<span class="chevron">▼</span> Protocol';
  document.getElementById('hdr-agents').innerHTML = '<span class="chevron">▼</span> Agents';
  document.getElementById('hdr-flow').innerHTML = '<span class="chevron">▼</span> $flow';
  document.getElementById('hdr-msgs').innerHTML = '<span class="chevron">▼</span> Messages';
  document.getElementById('hdr-stats').innerHTML = '<span class="chevron">▼</span> Stats';

  // Protocol info
  document.getElementById('panel-proto').innerHTML = `
    <dl class="proto-meta">
      <dt>Protocol</dt><dd>${d.proto.name}</dd>
      <dt>Participants</dt><dd>${d.proto.participants.join(', ')}</dd>
      <dt>Initiator</dt><dd>${d.proto.initiator}</dd>
      <dt>Input</dt><dd>${d.proto.input}</dd>
      <dt>Messages</dt><dd>${d.proto.messages.join(', ')}</dd>
    </dl>`;

  // Agents
  let agentsHtml = '';
  for (const a of d.agents) {
    const st = a.states[Math.min(step, a.states.length - 1)];
    const dotClass = !debugMode ? 'idle' : (step >= d.steps.length - 1 ? 'done' : 'running');
    const ctxEntries = Object.entries(st.$ctx);
    const selfEntries = Object.entries(st.$self);

    agentsHtml += `<div class="agent-card">
      <div class="agent-card-header">
        <span class="agent-dot ${dotClass}"></span>
        <span class="agent-name">${a.name}</span>
        <span class="agent-role">${a.role} [${a.lang}]</span>
      </div>`;

    if (ctxEntries.length > 0) {
      agentsHtml += `<div class="ctx-scope-label">$ctx</div><table class="ctx-table">`;
      for (const [k, v] of ctxEntries) {
        agentsHtml += `<tr><td class="ctx-key">${esc(k)}</td><td class="ctx-val">${esc(String(v))}</td></tr>`;
      }
      agentsHtml += `</table>`;
    }
    if (selfEntries.length > 0) {
      agentsHtml += `<div class="ctx-scope-label">$self</div><table class="ctx-table">`;
      for (const [k, v] of selfEntries) {
        agentsHtml += `<tr><td class="ctx-key">${esc(k)}</td><td class="ctx-val">${esc(String(v))}</td></tr>`;
      }
      agentsHtml += `</table>`;
    }
    if (ctxEntries.length === 0 && selfEntries.length === 0) {
      agentsHtml += `<div style="color:var(--vscode-disabledForeground);font-size:10px;font-style:italic">No state yet</div>`;
    }
    agentsHtml += `</div>`;
  }
  document.getElementById('panel-agents').innerHTML = agentsHtml;

  // $flow
  const flowState = d.flow[Math.min(step, d.flow.length - 1)];
  const flowEntries = Object.entries(flowState);
  document.getElementById('panel-flow').innerHTML = flowEntries.length > 0
    ? flowEntries.map(([k, v]) => `<div class="flow-entry"><span class="flow-key">$flow.${esc(k)}</span> <span class="flow-val">= ${esc(String(v))}</span></div>`).join('')
    : '<div style="color:var(--vscode-disabledForeground);font-size:10px;font-style:italic">Empty</div>';

  // Messages
  const visibleMsgs = d.msgLog.filter(m => !debugMode || m.step <= step);
  const heldMsgs = debugMode ? d.msgLog.filter(m => m.step === step + 1).slice(0, 1) : [];
  let msgsHtml = '';
  for (const m of visibleMsgs) {
    msgsHtml += `<div class="msg-log-entry">
      <span class="msg-dir">${m.dir === '→' ? '📤' : '📥'}</span>
      <span class="msg-name">${esc(m.name)}</span>
      <span class="msg-route">${esc(m.from)} → ${esc(m.to)}</span>
      ${m.detail ? `<span class="msg-route">${esc(m.detail)}</span>` : ''}
      <span class="msg-ts">#${m.step}</span>
    </div>`;
  }
  for (const m of heldMsgs) {
    msgsHtml += `<div class="msg-log-entry held">
      <span class="msg-dir">⏳</span>
      <span class="msg-name">${esc(m.name)}</span>
      <span class="msg-route">${esc(m.from)} → ${esc(m.to)} (held)</span>
    </div>`;
  }
  if (!msgsHtml) msgsHtml = '<div style="color:var(--vscode-disabledForeground);font-size:10px;font-style:italic">No messages yet</div>';
  document.getElementById('panel-msgs').innerHTML = msgsHtml;

  // Stats
  const totalMsgs = visibleMsgs.length;
  const statesVisited = debugMode ? step + 1 : d.steps.length;
  const totalStates = d.steps.length;
  document.getElementById('panel-stats').innerHTML = `
    <div class="stats-row">
      <span class="stat-badge msg-stat"><span class="stat-num">${totalMsgs}</span> messages</span>
      <span class="stat-badge state-stat"><span class="stat-num">${statesVisited}/${totalStates}</span> states</span>
      <span class="stat-badge agent-stat"><span class="stat-num">${d.agents.length}</span> agents</span>
      ${debugMode ? `<span class="stat-badge time-stat"><span class="stat-num">${(step * 12 + 5)}ms</span> elapsed</span>` : ''}
    </div>`;

  // Debug controls
  const ctrlBar = document.getElementById('debug-controls');
  ctrlBar.classList.toggle('visible', debugMode);
  if (debugMode) {
    const sn = d.stateNames[Math.min(step, d.stateNames.length - 1)];
    document.getElementById('ctrl-status').innerHTML =
      `Paused at <span class="state-name">${esc(sn)}</span> <span class="step-count">step ${step + 1}/${d.steps.length}</span>`;
    document.getElementById('ctrl-agent').innerHTML =
      d.agents.map(a => `<option>${a.name}</option>`).join('');
  }
}

      svg += `</g>`;
    }
  }
  svg += arrowMarker() + `</svg>`;
  return svg;
}

function smNodeCls(idx, total) {
  if (!debugMode) return '';
  const v = debugStep;
  if (idx === v) return 'active';
  if (idx < v) return 'visited';
  return 'future';
}

function smLinear(w, h, cx, nodes) {
  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  for (let i = 0; i < nodes.length - 1; i++) {
    svg += `<line x1="${cx}" y1="${nodes[i].y+18}" x2="${cx}" y2="${nodes[i+1].y-18}" class="sm-edge" marker-end="url(#sm-arrow)"/>`;
  }
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const cls = smNodeCls(i, nodes.length);
    const tt = debugMode ? `data-tooltip="${esc(n.id)}"` : '';
    if (n.kind === 'initial' || n.kind === 'terminal') {
      svg += `<g class="sm-node ${cls}" data-src-line="${n.line}" ${tt}><circle cx="${cx}" cy="${n.y}" r="14" class="sm-circle sm-${n.kind}"/><text x="${cx}" y="${n.y+5}" class="sm-label-center">${n.label}</text></g>`;
    } else {
      svg += `<g class="sm-node ${cls}" data-src-line="${n.line}" ${tt}><rect x="${cx-65}" y="${n.y-16}" width="130" height="32" rx="4" class="sm-rect sm-${n.kind}"/><text x="${cx}" y="${n.y+5}" class="sm-label-center">${esc(n.label)}</text></g>`;
    }
  }
  svg += arrowMarker() + `</svg>`;
  return svg;
}

// ── Topology diagram ──────────────────────────────────────────

function topoDiagram() {
  const dd = getDeployData();
  const W = 900, H = 580;
  const nodeW = 220, nodeH_base = 64, agentH = 36, agentGap = 6, nodePad = 10;

  const layoutPositions = {
    1: [{x:300,y:100}],
    2: [{x:100,y:100},{x:520,y:100}],
    3: [{x:300,y:30},{x:80,y:300},{x:520,y:300}],
    4: [{x:80,y:30},{x:520,y:30},{x:80,y:300},{x:520,y:300}],
  };
  const count = dd.nodes.length;
  const positions = layoutPositions[Math.min(count, 4)] || layoutPositions[4];

  const nodeRects = dd.nodes.map((n, i) => {
    const p = positions[i % positions.length];
    const extraY = i >= 4 ? 260 : 0;
    const agentCount = Math.max(n.agents.length, 0);
    const h = nodeH_base + agentCount * (agentH + agentGap) + nodePad;
    return { ...n, x: p.x, y: p.y + extraY, w: nodeW + 60, h, cx: p.x + (nodeW + 60) / 2, cy: p.y + extraY + h / 2 };
  });

  const nodeMap = {};
  nodeRects.forEach(n => nodeMap[n.nodeId] = n);

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs>
    <marker id="topo-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="var(--vscode-charts-yellow)"/>
    </marker>
    <marker id="topo-arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="var(--vscode-charts-green)"/>
    </marker>
  </defs>`;

  for (const link of dd.links) {
    const a = nodeMap[link.from], b = nodeMap[link.to];
    if (!a || !b) continue;
    const cls = link.status === 'active' ? 'topo-link active' : 'topo-link';
    const marker = link.status === 'active' ? 'url(#topo-arrow-green)' : 'url(#topo-arrow)';
    const ax = a.cx, ay = a.cy, bx = b.cx, by = b.cy;
    const dx = bx - ax, dy = by - ay;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const nx = dx / dist, ny = dy / dist;
    const x1 = ax + nx * 50, y1 = ay + ny * 30;
    const x2 = bx - nx * 50, y2 = by - ny * 30;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    svg += `<g class="topo-link-group" data-link-from="${link.from}" data-link-to="${link.to}">`;
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" marker-end="${marker}"/>`;
    const badge = link.status === 'active' ? `${link.type.toUpperCase()} ${link.msgRate}` : `${link.type.toUpperCase()} (down)`;
    svg += `<rect x="${mx - 45}" y="${my - 9}" width="90" height="18" rx="9" fill="var(--vscode-editor-background)" stroke="${link.status==='active'?'var(--vscode-charts-green)':'var(--vscode-panel-border)'}" stroke-width="1"/>`;
    svg += `<text x="${mx}" y="${my + 4}" text-anchor="middle" class="topo-link-label" style="fill:${link.status==='active'?'var(--vscode-charts-green)':'var(--vscode-descriptionForeground)'}">${esc(badge)}</text>`;
    svg += `</g>`;
  }

  for (const n of nodeRects) {
    const sel = n.nodeId === selectedNode;
    const typeCls = n.type ? ` type-${n.type}` : '';
    svg += `<g class="topo-node-group" data-node-id="${n.nodeId}">`;
    svg += `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" class="topo-rc${sel ? ' selected' : ''}${typeCls}"/>`;
    svg += `<circle cx="${n.x + 14}" cy="${n.y + 18}" class="topo-status-dot ${n.status}" r="4"/>`;
    svg += `<text x="${n.x + 24}" y="${n.y + 22}" class="topo-rc-label">${esc(n.nodeId)}</text>`;

    const rtColor = (n.runtime||'').includes('py') ? 'runtime-py' : (n.runtime||'').includes('browser') ? 'runtime-ts-browser' : 'runtime-ts';
    const rtLabel = n.runtime || 'ts';
    const rtW = rtLabel.length * 6 + 10;
    svg += `<rect x="${n.x + n.w - rtW - 28}" y="${n.y + 10}" width="${rtW}" height="14" class="topo-node-badge-bg ${rtColor}"/>`;
    svg += `<text x="${n.x + n.w - rtW/2 - 28}" y="${n.y + 20}" text-anchor="middle" class="topo-node-badge">${esc(rtLabel)}</text>`;

    const typeIcon = n.type === 'browser' ? '🌐' : n.type === 'robot' ? '🤖' : n.type === 'sim' ? '🧪' : n.type === 'ssh' ? '🖥' : n.type === 'docker' ? '🐳' : '💻';
    svg += `<text x="${n.x + n.w - 16}" y="${n.y + 22}" text-anchor="end" style="font-size:12px">${typeIcon}</text>`;

    svg += `<text x="${n.x + 14}" y="${n.y + 36}" class="topo-rc-sub">${esc(n.host)}</text>`;

    if (n.status === 'discovered') {
      svg += `<text x="${n.x + n.w - 14}" y="${n.y + 36}" text-anchor="end" class="topo-constraint">discovered</text>`;
    }

    let ay = n.y + 44;
    for (const agent of n.agents) {
      const agentSel = selectedAgent === agent.name;
      const langCls = agent.lang === 'ts' ? 'lang-ts' : agent.lang === 'py' ? 'lang-py' : 'lang-any';
      svg += `<g class="topo-agent-group" data-agent-name="${agent.name}">`;
      svg += `<rect x="${n.x + 8}" y="${ay}" width="${n.w - 16}" height="${agentH}" class="topo-agent-box ${langCls}${agentSel ? ' selected' : ''}"/>`;
      svg += `<circle cx="${n.x + 20}" cy="${ay + agentH/2}" class="topo-status-dot ${agent.status}" r="3"/>`;
      svg += `<text x="${n.x + 30}" y="${ay + 14}" class="topo-agent-label">${esc(agent.name)}</text>`;
      svg += `<text x="${n.x + n.w - 16}" y="${ay + 14}" text-anchor="end" class="topo-agent-role">[${agent.lang}]</text>`;
      const playsStr = agent.plays.map(p => p.proto + '.' + p.role).join(', ');
      svg += `<text x="${n.x + 30}" y="${ay + 28}" class="topo-agent-role">${esc(playsStr)}</text>`;
      svg += `</g>`;
      ay += agentH + agentGap;
    }

    if (n.agents.length === 0) {
      svg += `<text x="${n.x + n.w/2}" y="${n.y + 56}" text-anchor="middle" style="font-size:10px;fill:var(--vscode-disabledForeground);font-style:italic">No agents deployed</text>`;
    }
    svg += `</g>`;
  }

  svg += `</svg>`;
  return svg;
}

// ── Topology side panel ───────────────────────────────────────

function renderTopoSidePanel() {
  const dd = getDeployData();
  const node = selectedNode ? dd.nodes.find(n => n.nodeId === selectedNode) : dd.nodes[0];

  document.getElementById('hdr-proto').innerHTML = '<span class="chevron">▼</span> Scenario';
  document.getElementById('hdr-agents').innerHTML = '<span class="chevron">▼</span> Node Inspector';
  document.getElementById('hdr-flow').innerHTML = '<span class="chevron">▼</span> Node Links';
  document.getElementById('hdr-msgs').innerHTML = '<span class="chevron">▼</span> Deploy Actions';
  document.getElementById('hdr-stats').innerHTML = '<span class="chevron">▼</span> Cluster Stats';

  document.getElementById('panel-stats').innerHTML = `
    <div class="stats-row">
      <span class="stat-badge agent-stat"><span class="stat-num">${dd.stats.totalAgents}</span> agents</span>
      <span class="stat-badge msg-stat"><span class="stat-num">${dd.stats.totalNodes}</span> nodes</span>
      <span class="stat-badge state-stat"><span class="stat-num">${dd.stats.activeLinks}</span> links</span>
      <span class="stat-badge time-stat"><span class="stat-num">${dd.stats.totalMsgRate}</span> throughput</span>
    </div>`;

  document.getElementById('panel-proto').innerHTML = `
    <div style="font-size:11px;font-weight:600;margin-bottom:4px">${esc(dd.title)}</div>
    <div class="provision-info">${esc(dd.description)}</div>
    <dl class="proto-meta" style="margin-top:6px">
      <dt>Protocols</dt><dd>${dd.protocols.join(', ')}</dd>
      <dt>Nodes</dt><dd>${dd.nodes.filter(n=>n.status==='online'||n.status==='discovered').length} online / ${dd.nodes.length} total</dd>
      <dt>Links</dt><dd>${dd.links.length === 0 ? 'none (loopback only)' : dd.links.filter(l=>l.status==='active').length + ' active'}</dd>
    </dl>`;

  let agentsHtml = '';

  if (node) {
    const typeCls = node.type || 'local';
    const canSSH = node.type === 'ssh' || node.type === 'local';
    const canMigrate = node.type !== 'browser' && node.type !== 'robot';
    const isDiscovered = node.status === 'discovered';

    agentsHtml += `<div class="deploy-card" style="border-color:var(--vscode-charts-blue)">
      <div class="deploy-card-header">
        <span class="agent-dot ${node.status === 'online' ? 'running' : node.status === 'discovered' ? 'running' : 'idle'}"></span>
        <span class="agent-name">${esc(node.label)}</span>
        <span class="node-type-tag ${typeCls}">${esc(typeCls)}</span>
      </div>
      <div class="link-config">
        <dt>Host</dt><dd>${esc(node.host)}</dd>
        <dt>Runtime</dt><dd>${esc(node.runtime)}</dd>
        <dt>AgentNode</dt><dd style="font-size:9px">${esc(node.agentNode)}</dd>
        <dt>Agents</dt><dd>${node.agents.length}</dd>
      </div>
      <div class="provision-info">⚙ ${esc(node.provision)}</div>
      <div class="deploy-action-row">
        ${canSSH ? '<button class="deploy-action-btn primary">Deploy protocol</button>' : ''}
        ${canSSH ? '<button class="deploy-action-btn">Add agent</button>' : ''}
        ${node.status === 'offline' && canSSH ? '<button class="deploy-action-btn primary">Start node</button>' : ''}
        ${node.status !== 'offline' && canSSH ? '<button class="deploy-action-btn danger">Stop node</button>' : ''}
        ${isDiscovered ? '<button class="deploy-action-btn">Pin to plan</button>' : ''}
        ${!canSSH && !isDiscovered ? '<span class="provision-info" style="padding:2px 0">Node self-manages — cannot provision remotely</span>' : ''}
      </div>
    </div>`;

    for (const a of node.agents) {
      const langBadge = `<span class="lang-badge ${a.lang === 'ts' ? 'ts' : a.lang === 'py' ? 'py' : 'any'}">${a.lang}</span>`;
      agentsHtml += `<div class="deploy-card${selectedAgent === a.name ? ' selected' : ''}" data-agent-card="${a.name}" style="${selectedAgent===a.name?'border-color:var(--vscode-charts-green)':''}">
        <div class="deploy-card-header">
          <span class="agent-dot ${a.status === 'online' ? 'running' : 'idle'}"></span>
          <span class="agent-name">${esc(a.name)}</span>
          ${langBadge}
        </div>
        <div class="deploy-plays">Role: <span>${esc(a.role)}</span></div>
        <div class="deploy-plays">Plays: ${a.plays.map(p => `<span>${esc(p.proto)}.${esc(p.role)}</span>`).join(', ')}</div>
        <div class="link-config">
          <dt>PID</dt><dd>${a.pid}</dd>
          <dt>Memory</dt><dd>${esc(a.mem)}</dd>
        </div>
        <div class="deploy-action-row">
          <button class="deploy-action-btn">Restart</button>
          ${canMigrate ? '<button class="deploy-action-btn">Migrate</button>' : ''}
          <button class="deploy-action-btn danger">Remove</button>
        </div>
      </div>`;
    }

    if (node.agents.length === 0 && node.status === 'offline') {
      agentsHtml += `<div style="text-align:center;padding:12px 0;color:var(--vscode-disabledForeground);font-size:11px;font-style:italic">
        Node is offline — ${canSSH ? 'click Start node to provision' : 'waiting for self-announcement'}
      </div>`;
    }
  }

  document.getElementById('panel-agents').innerHTML = agentsHtml;

  let linksHtml = '';
  const nodeId = node ? node.nodeId : '';
  const nodeLinks = dd.links.filter(l => l.from === nodeId || l.to === nodeId);
  for (const link of nodeLinks) {
    const peer = link.from === nodeId ? link.to : link.from;
    linksHtml += `<div class="deploy-card">
      <div class="deploy-card-header">
        <span class="agent-dot ${link.status === 'active' ? 'running' : 'idle'}"></span>
        <span class="agent-name">${esc(nodeId)} ↔ ${esc(peer)}</span>
      </div>
      <div class="link-config">
        <dt>Type</dt><dd>${esc(link.type.toUpperCase())}</dd>
        <dt>URL</dt><dd style="font-size:9px;word-break:break-all">${esc(link.url)}</dd>
        <dt>Rate</dt><dd>${esc(link.msgRate)}</dd>
        <dt>Latency</dt><dd>${esc(link.latency)}</dd>
      </div>
      <div class="deploy-action-row">
        ${link.status === 'active' ? '<button class="deploy-action-btn danger">Disconnect</button>' : '<button class="deploy-action-btn primary">Reconnect</button>'}
      </div>
    </div>`;
  }
  if (dd.links.length === 0) {
    linksHtml = '<div class="provision-info" style="font-style:italic">No links — all agents on single node, loopback routing (zero-copy)</div>';
  } else if (!linksHtml) {
    linksHtml = '<div style="color:var(--vscode-disabledForeground);font-size:10px;font-style:italic">Select a node to see its links</div>';
  }

  document.getElementById('panel-flow').innerHTML = linksHtml;

  const hasProvisionable = dd.nodes.some(n => n.type === 'ssh' || n.type === 'local' || n.type === 'docker');
  document.getElementById('panel-msgs').innerHTML = `
    <div class="deploy-action-row" style="flex-wrap:wrap;gap:4px">
      <select class="node-sel">${dd.protocols.map(p => `<option>${p}</option>`).join('')}</select>
      <select class="node-sel">${dd.nodes.map(n => `<option value="${n.nodeId}">${n.label}</option>`).join('')}</select>
      <button class="deploy-action-btn primary" style="flex:1">Deploy to node</button>
    </div>
    <div class="deploy-action-row" style="flex-wrap:wrap;gap:4px;margin-top:6px">
      ${hasProvisionable ? '<button class="deploy-action-btn" style="flex:1">Add Node</button>' : ''}
      <button class="deploy-action-btn" style="flex:1">Auto-balance</button>
      <button class="deploy-action-btn danger" style="flex:1">Teardown all</button>
    </div>`;
}

// ── Render all ────────────────────────────────────────────────

function render() {
  btnSeq.className = `tab ${viewMode==='sequence'?'active':''}`;
  btnSm.className = `tab ${viewMode==='statemachine'?'active':''}`;
  btnTopo.className = `tab ${viewMode==='topology'?'active':''}`;
  btnDebug.className = `debug-toggle ${debugMode?'active':''}`;
  roleSel.style.display = viewMode==='statemachine'?'':'none';
  exampleSel.style.display = viewMode==='topology'?'none':'';
  topoScenarioSel.style.display = viewMode==='topology'?'':'none';

  if (viewMode === 'topology') {
    document.getElementById('diagram').innerHTML = topoDiagram();
    renderTopoSidePanel();
    wireTopoInteractions();
    const ctrlBar = document.getElementById('debug-controls');
    ctrlBar.classList.remove('visible');
    return;
  }

  const d = mockData[selectedExample];
  if (!d || !d.roles) return;
  roleSel.innerHTML = d.roles.map(r=>`<option value="${r}" ${selectedRole===r?'selected':''}>${r}</option>`).join('');

  const svg = viewMode==='sequence'
    ? seqDiagram()
    : (selectedExample==='01' ? sm01() : sm03());
  document.getElementById('diagram').innerHTML = svg;

  renderSidePanel();
  wireInteractions();
}

function wireInteractions() {
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('[data-src-line]').forEach(el => {
    el.addEventListener('click', () => {
      const line = el.getAttribute('data-src-line');
      const file = selectedExample==='01'?'01-task-execution-basic.rg':'03-loop-retry-backoff.rg';
      console.log(`editor.revealRange → line ${line} of ${file}`);
    });
  });
  document.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', (e) => { if(!tooltip)return; tooltip.textContent=el.getAttribute('data-tooltip'); tooltip.style.display='block'; tooltip.style.left=e.pageX+12+'px'; tooltip.style.top=e.pageY-8+'px'; });
    el.addEventListener('mousemove', (e) => { if(!tooltip)return; tooltip.style.left=e.pageX+12+'px'; tooltip.style.top=e.pageY-8+'px'; });
    el.addEventListener('mouseleave', () => { if(tooltip)tooltip.style.display='none'; });
  });
}

function wireTopoInteractions() {
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.topo-node-group').forEach(el => {
    el.addEventListener('click', () => {
      selectedNode = el.getAttribute('data-node-id');
      selectedAgent = null;
      render();
    });
  });
  document.querySelectorAll('.topo-agent-group').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedAgent = el.getAttribute('data-agent-name');
      const parentNode = el.closest('.topo-node-group');
      if (parentNode) selectedNode = parentNode.getAttribute('data-node-id');
      render();
    });
  });
  document.querySelectorAll('.topo-link-group').forEach(el => {
    el.addEventListener('mouseenter', (e) => {
      const from = el.getAttribute('data-link-from'), to = el.getAttribute('data-link-to');
      const link = getDeployData().links.find(l => l.from === from && l.to === to);
      if (!link || !tooltip) return;
      tooltip.textContent = `${link.type.toUpperCase()} ${link.url}\nRate: ${link.msgRate}  Latency: ${link.latency}`;
      tooltip.style.display = 'block';
      tooltip.style.left = e.pageX + 12 + 'px';
      tooltip.style.top = e.pageY - 8 + 'px';
    });
    el.addEventListener('mousemove', (e) => { if(tooltip){ tooltip.style.left=e.pageX+12+'px'; tooltip.style.top=e.pageY-8+'px'; }});
    el.addEventListener('mouseleave', () => { if(tooltip) tooltip.style.display='none'; });
  });
  document.querySelectorAll('[data-agent-card]').forEach(el => {
    el.addEventListener('click', () => {
      selectedAgent = el.getAttribute('data-agent-card');
      render();
    });
  });
}

render();
</script>
</body>
</html>
